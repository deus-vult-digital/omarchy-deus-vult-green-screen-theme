# Deus Vult Green Screen: P1 green phosphor on a dark CRT field (deusvult.digital).
# Background, foreground, accent and borders are the P1 ramp. The ANSI
# colours are the same in every Deus Vult phosphor (the site's other phosphors
# and a plain red), so errors, warnings and diffs still read as what they are.
# Generated by tools/build.py from phosphors.toml.

mode = "dark"

accent = "#22c55e"
selection = "#14532d"
muted = "#3f6b4e"

background = "#050b07"
dark_background = "#030704"
darker_background = "#010201"
lighter_background = "#0b1a10"

foreground = "#86efac"
dark_foreground = "#15803d"
light_foreground = "#bbf7d0"
bright_foreground = "#dcfce7"

hyprland_active_border = "rgba(4ade80ee) rgba(15803dee) 45deg"
hyprland_inactive_border = "rgba(14532daa)"

red = "#f87171"
yellow = "#fbbf24"
orange = "#fb923c"
green = "#22c55e"
cyan = "#2dd4bf"
blue = "#60a5fa"
magenta = "#c084fc"
brown = "#b45309"

bright_red = "#fca5a5"
bright_yellow = "#fde68a"
bright_green = "#4ade80"
bright_cyan = "#5eead4"
bright_blue = "#93c5fd"
bright_magenta = "#d8b4fe"
